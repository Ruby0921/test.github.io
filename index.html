(function(){
  const home=document.getElementById('home');
  const cover=document.getElementById('cover');
  const menu=document.getElementById('menu');
  const wordDetail=document.getElementById('wordDetail');
  const wordHome=document.getElementById('wordHome');
  const wordRen=document.getElementById('wordRen');
  const wordYe=document.getElementById('wordYe');

  function show(screen){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    screen.classList.add('active');
    window.scrollTo(0,0);
  }

  function showCover(){ show(cover); }
  function showMenu(){ show(menu); }
  function showHome(){ show(home); }
  function showWordDetail(){ show(wordDetail); }
  function showWordHome(){ show(wordHome); }
  function showWordRen(){ show(wordRen); }
  function showWordYe(){ show(wordYe); }
  function showWordNai(){ show(wordNai); }

  // 使用单一 pointerup 事件，避免 click + pointerup 重复触发。
  function bindButton(id, action){
    const el=document.getElementById(id);
    if(!el) return;
    let last=0;
    el.addEventListener('pointerup', function(e){
      e.preventDefault();
      const now=Date.now();
      if(now-last<300) return;
      last=now;
      action();
    });
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        action();
      }
    });
  }

  bindButton('homeStart', showCover);
  bindButton('coverStart', showMenu);
  bindButton('coverHome', showHome);
  bindButton('menuHome', showHome);
  bindButton('menuLesson1', showWordDetail);

  // 认识生字页左上角：明确返回网站首页。
  bindButton('wordSelectHome', showHome);

  // 1.1.1.1“这”字页左上角：返回上一页 1.1.1。
  bindButton('wordThis', showWordDetail);
  bindButton('wordDetailBack', showMenu);
  // 1.1.1.1 点击“家” → 1.1.1.2 家字页面
  bindButton('wordJia', showWordHome);
  bindButton('wordRenFromZhe', showWordRen);
  bindButton('wordYeFromZhe', showWordYe);
  // 1.1.1.2 左上角返回 → 1.1.1.1
  bindButton('wordHomeBack', showMenu);
  bindButton('wordZheFromJia', showWordDetail);
  bindButton('wordRenFromJia', showWordRen);
  bindButton('wordYeFromJia', showWordYe);
  // 1.1.1.3「人」页面与其他两个生字页面互通
  bindButton('wordZheFromRen', showWordDetail);
  bindButton('wordJiaFromRen', showWordHome);
  bindButton('wordYeFromRen', showWordYe);
  bindButton('wordZheFromYe', showWordDetail);
  bindButton('wordJiaFromYe', showWordHome);
  bindButton('wordRenFromYe', showWordRen);
  bindButton('wordYeFromYe', showWordYe);
  bindButton('wordNaiFromZhe', showWordNai);
  bindButton('wordNaiFromJia', showWordNai);
  bindButton('wordNaiFromRen', showWordNai);
  bindButton('wordNaiFromYe', showWordNai);
  bindButton('wordZheFromNai', showWordDetail);
  bindButton('wordJiaFromNai', showWordHome);
  bindButton('wordRenFromNai', showWordRen);
  bindButton('wordYeFromNai', showWordYe);
})();
</script>

<script>
(function () {
  let zheRate = 0.95;

  function speakZhe() {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
      alert("当前浏览器不支持语音朗读，请使用 Chrome 浏览器。");
      return;
    }

    window.speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance("这");
    u.lang = "zh-CN";
    u.rate = zheRate;
    u.pitch = 1;
    u.volume = 1;

    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v =>
      /^zh-CN$/i.test(v.lang) || /^zh/i.test(v.lang)
    );
    if (zhVoice) u.voice = zhVoice;

    window.speechSynthesis.speak(u);
  }


  function bindSpeedDrag() {
    const drag = document.getElementById("wordSpeedDrag");
    const speed = document.getElementById("wordSpeedZhe");
    if (!drag || !speed || drag.dataset.bound === "1") return;

    drag.dataset.bound = "1";
    let dragging = false;

    function setFromPointer(clientX) {
      const rect = drag.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const value = Math.round(ratio * 100) / 100;
      speed.value = String(value);

      // 直接更新语速和蓝点位置，确保视觉和实际语速同步。
      zheRate = 0.55 + value * 0.8;

      // 触发 input，让原有朗读逻辑保持一致。
      speed.dispatchEvent(new Event("input", {bubbles:true}));
    }

    drag.addEventListener("pointerdown", function(e) {
      e.preventDefault();
      dragging = true;
      if (drag.setPointerCapture) drag.setPointerCapture(e.pointerId);
      setFromPointer(e.clientX);
    });

    drag.addEventListener("pointermove", function(e) {
      if (!dragging) return;
      e.preventDefault();
      setFromPointer(e.clientX);
    });

    function stop(e) {
      if (!dragging) return;
      dragging = false;
      if (e && drag.releasePointerCapture) {
        try { drag.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    drag.addEventListener("pointerup", stop);
    drag.addEventListener("pointercancel", stop);
    drag.addEventListener("lostpointercapture", function(){ dragging = false; });
  }

    );
    if (zhVoice) u.voice = zhVoice;

    window.speechSynthesis.speak(u);
  }


  function bindSpeedDrag() {
    const drag = document.getElementById("wordSpeedDrag");
    const speed = document.getElementById("wordSpeedRen");
    if (!drag || !speed || drag.dataset.bound === "1") return;

    drag.dataset.bound = "1";
    let dragging = false;

    function setFromPointer(clientX) {
      const rect = drag.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const value = Math.round(ratio * 100) / 100;
      speed.value = String(value);

      // 直接更新语速和蓝点位置，确保视觉和实际语速同步。
      renRate = 0.55 + value * 0.8;

      // 触发 input，让原有朗读逻辑保持一致。
      speed.dispatchEvent(new Event("input", {bubbles:true}));
    }

    drag.addEventListener("pointerdown", function(e) {
      e.preventDefault();
      dragging = true;
      if (drag.setPointerCapture) drag.setPointerCapture(e.pointerId);
      setFromPointer(e.clientX);
    });

    drag.addEventListener("pointermove", function(e) {
      if (!dragging) return;
      e.preventDefault();
      setFromPointer(e.clientX);
    });

    function stop(e) {
      if (!dragging) return;
      dragging = false;
      if (e && drag.releasePointerCapture) {
        try { drag.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    drag.addEventListener("pointerup", stop);
    drag.addEventListener("pointercancel", stop);
    drag.addEventListener("lostpointercapture", function(){ dragging = false; });
  }

<script id="heVisibleSpeedDot">
(function(){
  function setup(){
    var page=document.getElementById("wordHe");
    if(!page)return;
    var canvas=page.querySelector(".canvas");
    var range=document.getElementById("heSpeedFix");
    if(!canvas || !range)return;
    if(document.getElementById("heBlueDot"))return;

    var dot=document.createElement("div");
    dot.id="heBlueDot";
    dot.setAttribute("aria-label","拖动调整语速");
    dot.style.cssText=
      "position:absolute;" +
      "left:57.25%;" +
      "top:74.2%;" +
      "width:38px;" +
      "height:38px;" +
      "border-radius:50%;" +
      "background:#1789f5;" +
      "border:3px solid #0b75e8;" +
      "box-shadow:0 2px 5px rgba(0,0,0,.25);" +
      "z-index:100002;" +
      "cursor:grab;" +
      "touch-action:none;" +
      "box-sizing:border-box;";

    canvas.appendChild(dot);

    function updateDot(){
      var value=Number(range.value);
      dot.style.left=(43.5 + value*27.5 - 1.7)+"%";
    }

    range.addEventListener("input",updateDot);

    var dragging=false;

    function setByX(x){
      var rect=range.getBoundingClientRect();
      var value=(x-rect.left)/rect.width;
      value=Math.max(0,Math.min(1,value));
      range.value=value;
      range.dispatchEvent(new Event("input",{bubbles:true}));
      updateDot();
    }

    dot.addEventListener("pointerdown",function(e){
      e.preventDefault();
      dragging=true;
      dot.style.cursor="grabbing";
      if(dot.setPointerCapture)dot.setPointerCapture(e.pointerId);
    });

    dot.addEventListener("pointermove",function(e){
      if(!dragging)return;
      e.preventDefault();
      setByX(e.clientX);
    });

    function stop(e){
      dragging=false;
      dot.style.cursor="grab";
      if(e && dot.releasePointerCapture){
        try{dot.releasePointerCapture(e.pointerId);}catch(_){}
      }
    }

    dot.addEventListener("pointerup",stop);
    dot.addEventListener("pointercancel",stop);
    dot.addEventListener("lostpointercapture",function(){dragging=false;dot.style.cursor="grab";});

    // 点击整条语速线也能移动蓝点
    range.style.pointerEvents="auto";
    range.style.cursor="ew-resize";
    range.style.opacity="0";

    updateDot();
  }

  window.addEventListener("DOMContentLoaded",setup);
  setTimeout(setup,100);
  setTimeout(setup,500);
  setTimeout(setup,1200);
})();
</script>
